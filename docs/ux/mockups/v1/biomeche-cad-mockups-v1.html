// M11, M12, M13 and M14 are defined above; provide a fallback for any missing screen during editing.
function render(id){
 const s=screens[id]||screens.M01;
 document.body.dataset.theme=s.theme||'light';
 document.body.classList.toggle('compact',!!s.compact);
 document.querySelectorAll('.screen-tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 document.getElementById('contextChips').innerHTML=s.context();
 document.getElementById('topActions').innerHTML=s.actions();
 document.getElementById('navRail').innerHTML=nav(s.active,id);
 document.getElementById('mainArea').innerHTML=s.main();
 document.getElementById('inspector').innerHTML=s.inspector();
 document.getElementById('bottomPanel').innerHTML=s.bottom();
 document.title=`${id} ${names[id]} — BiomechE-CAD v1`;
 location.hash=id;
}
const tabs=document.getElementById('screenTabs');
tabs.innerHTML=ids.map(id=>`<button class="screen-tab" data-id="${id}" title="${id} ${names[id]}">${id} ${names[id]}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)render(b.dataset.id)});
document.getElementById('themeToggle').addEventListener('click',()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';const id=(location.hash||'#M01').slice(1);document.getElementById('mainArea').innerHTML=screens[id].main()});
document.getElementById('compactToggle').addEventListener('click',()=>document.body.classList.toggle('compact'));
const initial=ids.includes(location.hash.slice(1))?location.hash.slice(1):'M01';render(initial);
</script>
